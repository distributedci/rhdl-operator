---
repos:
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        description: Ensures go.mod and go.sum are up to date
        entry: go mod tidy
        language: system
        files: '^go\.(mod|sum)$|\.go$'
        pass_filenames: false
        stages: [pre-commit]
      - id: append-assisted-by
        name: append assisted-by
        description: Automatically appends Assisted-By line to commit messages
        entry: >
          bash -c 'if ! grep -q "^Merge branch " "$1" && ! grep -q "^Assisted-By: " "$1"; then echo "" >> "$1"; echo "Assisted-By: Cursor (claude-4-sonnet)" >> "$1"; fi' --
        language: system
        pass_filenames: true
        stages: [commit-msg]