kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: downloaders.rhdl.distributed-ci.io
spec:
  group: rhdl.distributed-ci.io
  names:
    kind: Downloader
    listKind: DownloaderList
    plural: downloaders
    singular: downloader
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Downloader is the Schema for the downloaders API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DownloaderSpec defines the desired state of Downloader.
            properties:
              containerImage:
                default: quay.io/rhdl/cli:latest
                description: 'ContainerImage is the image to use for the downloader
                  container (default: quay.io/rhdl/cli:latest).'
                type: string
              credentials:
                default: credentials
                description: |-
                  Credentials is the reference to the secret containing the authentication
                  variables e.g. RHDL_ACCESS_KEY, RHDL_SECRET_KEY, RHDL_API_URL (default:
                  credentials).
                type: string
              extraArgs:
                description: 'ExtraArgs is a list of extra arguments to pass to the
                  downloader container (default: []).'
                items:
                  type: string
                type: array
              persistentVolumeClaim:
                description: PersistentVolumeClaim is the reference to the persistent
                  volume claim to use for the downloader container. If defined, will
                  always mount to /mnt.
                type: string
              pullPolicy:
                default: Always
                description: 'PullPolicy is the policy to use the downloader container
                  (default: Always).'
                type: string
              schedule:
                default: '@daily'
                description: 'Schedule is how often to download the topic in cron
                  format (default: @daily).'
                pattern: ^(@(annually|yearly|monthly|weekly|daily|hourly))|([0-9*,/-]+\s+[0-9*,/-]+\s+[0-9*,/-]+\s+[0-9*,/-]+\s+[0-9*,/-]+)$
