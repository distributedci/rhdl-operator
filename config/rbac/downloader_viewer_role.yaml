# This rule is not used by the project rhdl-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to rhdl.distributed-ci.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rhdl-operator
    app.kubernetes.io/managed-by: kustomize
  name: downloader-viewer-role
rules:
- apiGroups:
  - rhdl.distributed-ci.io
  resources:
  - downloaders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rhdl.distributed-ci.io
  resources:
  - downloaders/status
  verbs:
  - get
