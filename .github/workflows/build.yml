name: Container snapshot

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    container:
      image: quay.io/rhdl/builder:latest
      env:
        IMAGE_TAG_BASE: quay.io/rhdl/operator
        STORAGE_DRIVER: vfs
        CONTAINER_TOOL: buildah
        SNAPSHOT: ""

    steps:
      - name: Install Go
        run: |
          dnf --assumeyes --refresh install golang

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate snapshot SHA
        run: |
          echo "SNAPSHOT=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build docker image
        run: |
          pwd
          ls -l
          make docker-build
