name: Container Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG_BASE: quay.io/rhdl/operator
      CONTAINER_TOOL: buildah

    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah skopeo

      - name: Login to quay.io
        run: |
          echo ${{ secrets.RHDL_QUAY_PASSWORD }} | buildah login -u ${{ secrets.RHDL_QUAY_USER }} --password-stdin quay.io

      - name: Generate build vars
        id: build_vars
        run: |
          SNAPSHOT_VALUE="-git$(echo ${{ github.sha }} | cut -c 1-7)"
          echo "SNAPSHOT=${SNAPSHOT_VALUE}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        env:
          SNAPSHOT: ${{ steps.build_vars.outputs.SNAPSHOT }}
        run: |
          make docker-build docker-push
          skopeo copy docker://${IMAGE_TAG_BASE}:$(make full-version) docker://${IMAGE_TAG_BASE}:latest
